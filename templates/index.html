<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neura — AI Prompt App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #020617, #000000);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #e5e7eb;
      overflow: hidden;
    }

    .glow-wrapper {
      position: relative;
      padding: 2px;
      border-radius: 22px;
      background: linear-gradient(
        270deg,
        #6366f1,
        #22d3ee,
        #a855f7,
        #6366f1
      );
      background-size: 600% 600%;
      animation: gradientMove 6s ease infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: rgba(2, 6, 23, 0.95);
      backdrop-filter: blur(18px);
      width: 95%;
      max-width: 640px;
      padding: 34px;
      border-radius: 20px;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
    }

    h1 {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 6px;
      letter-spacing: 0.6px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 30px;
    }

    .label {
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: #9ca3af;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      height: 130px;
      background: #020617;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px;
      font-size: 0.95rem;
      color: #e5e7eb;
      outline: none;
      transition: all 0.25s ease;
    }

    textarea::placeholder {
      color: #6b7280;
    }

    textarea:focus {
      border-color: #22d3ee;
      box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.25);
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      color: #020617;
      background: linear-gradient(135deg, #22d3ee, #6366f1);
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.6);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 45px rgba(99, 102, 241, 0.9);
    }

    .response-wrapper {
      margin-top: 28px;
    }

    .response-box {
      background: #020617;
      border-radius: 16px;
      padding: 18px;
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
      border-left: 4px solid #22d3ee;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
  </style>
</head>

<body>
  <div class="glow-wrapper">
    <div class="card">
      <h1>Neura</h1>
      <p class="subtitle">A next-gen AI prompt experience</p>

      <form method="POST">
        <div class="label">ENTER YOUR PROMPT</div>
        <textarea
          name="prompt"
          placeholder="Ask anything…"
          required
        ></textarea>

        <button type="submit">Generate Intelligence</button>
      </form>

      {% if response %}
        <div class="response-wrapper">
          <div class="label">AI RESPONSE</div>
          <div class="response-box">
            {{ response }}
          </div>
        </div>
      {% endif %}
    </div>
  </div>
</body>
</html>
